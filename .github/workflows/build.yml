name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 가격 판단 규칙 시험
        run: ./gradlew :core:test --no-daemon

      - name: 앱 만들기
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 설치파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk air-search.apk

      # main 은 'latest', 다른 브랜치는 'test-build' (체험용) 로 같은 주소에 덮어 올린다
      - name: 올릴 이름 정하기
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-build" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 태그를 이번 커밋으로 옮기기
        run: |
          git tag -f "${{ steps.tag.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.tag.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag == 'latest' && '항공권 가격 알림 (최신)' || '항공권 가격 알림 (체험용)' }}
          prerelease: ${{ steps.tag.outputs.pre }}
          body: |
            ${{ github.ref_name }} 브랜치 · ${{ github.sha }} · 빌드 ${{ github.run_number }}
            핸드폰에서 air-search.apk 를 내려받아 설치하세요.
          files: air-search.apk
          fail_on_unmatched_files: true
